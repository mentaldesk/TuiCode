name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build TuiCode.slnx --configuration Release

      - name: Test
        # MTP args go after `--`. xunit.v3 ships the TRX report extension.
        run: dotnet test TuiCode.slnx --configuration Release --no-build -- --report-trx --report-trx-filename test-results.trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: warn

      - name: AOT publish
        run: dotnet publish src/TuiCode/TuiCode.csproj -c Release -r linux-x64 -o publish

      - name: AOT smoke
        # `dotnet test` runs JIT, so AOT-only failures (missing metadata,
        # trim-stripped paths) only surface against the published native
        # binary. `script` allocates a pty so TG's driver initializes.
        run: timeout 20s script -qfec './publish/TuiCode --smoke' /dev/null
