name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build TuiCode.slnx --configuration Release

      - name: Test
        # MTP args go after `--`. xunit.v3 ships the TRX report extension.
        run: dotnet test TuiCode.slnx --configuration Release --no-build -- --report-trx --report-trx-filename test-results.trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**'
          if-no-files-found: warn

      # AOT publish + pty smoke stay Linux-only: the smoke harness uses `script`/`timeout`
      # (Unix) and we only verify the linux-x64 native binary here. The Windows leg exists
      # for the JIT test run, which is where OS-specific bugs (path separators, CRLF) surface.
      - name: AOT publish
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish src/TuiCode/TuiCode.csproj -c Release -r linux-x64 -o publish

      - name: AOT smoke
        # `dotnet test` runs JIT, so AOT-only failures (missing metadata,
        # trim-stripped paths) only surface against the published native
        # binary. `script` allocates a pty so TG's driver initializes.
        if: matrix.os == 'ubuntu-latest'
        run: timeout 20s script -qfec './publish/TuiCode --smoke' /dev/null
