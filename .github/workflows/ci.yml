name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  lint-workflows:
    # release.yml is only exercised by a real release, so its YAML gets linted here instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker://rhysd/actionlint:1.7.7
      - name: shellcheck
        run: shellcheck install.sh tests/install/test.sh

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Safety net: the whole suite runs in seconds. If a UI test ever blocks on a real
    # console driver again (see WorkbenchHost driverName), fail fast instead of letting
    # the default 6h job timeout burn runner minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        # Unshallow: MinVer reads the version off the latest v* tag.
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build TuiCode.slnx --configuration Release

      - name: Test
        # MTP args go after `--`. xunit.v3 ships the TRX report extension.
        run: dotnet test TuiCode.slnx --configuration Release --no-build -- --report-trx --report-trx-filename test-results.trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**'
          if-no-files-found: warn

  aot:
    name: AOT ${{ matrix.rid }}
    # Native runners, as in release.yml: the static Oniguruma link (TuiCode.Syntax) can break per RID.
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-14
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: linux-arm64
            runner: ubuntu-22.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        # Unshallow: MinVer reads the version off the latest v* tag.
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: AOT publish
        run: dotnet publish src/TuiCode/TuiCode.csproj -c Release -r ${{ matrix.rid }} -o publish

      - name: Third-party notices published
        # release.yml archives these beside the binary.
        shell: bash
        run: test -s publish/THIRD-PARTY-NOTICES.md && test -s publish/DOTNET-THIRD-PARTY-NOTICES.TXT

      - name: Invariant globalization on Linux only
        shell: bash
        run: |
          config=src/TuiCode/bin/Release/net10.0/${{ matrix.rid }}/TuiCode.runtimeconfig.json
          if grep -q '"System.Globalization.Invariant": true' "$config"; then actual=invariant; else actual=icu; fi
          case "${{ matrix.rid }}" in linux-*) expected=invariant ;; *) expected=icu ;; esac
          echo "${{ matrix.rid }}: $actual, expected $expected"
          [ "$actual" = "$expected" ]

      - name: glibc floor
        # Debian 12 / Ubuntu 22.04 are the oldest supported distros (README).
        if: startsWith(matrix.rid, 'linux-')
        run: |
          readelf -d publish/TuiCode | grep NEEDED
          highest=$(objdump -T publish/TuiCode | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -n1)
          echo "Highest glibc symbol: $highest"
          [ "$(printf '%s\n' "$highest" GLIBC_2.35 | sort -V | tail -n1)" = GLIBC_2.35 ]

      - name: Distro smoke
        # Minimal images without libicu; `script` gives `docker run -t` the pty TG needs.
        if: startsWith(matrix.rid, 'linux-')
        run: |
          for image in debian:12 ubuntu:22.04 fedora:latest; do
            echo "::group::$image"
            docker pull -q "$image"
            if docker run --rm "$image" sh -c 'ldconfig -p | grep -q libicu'; then
              echo "$image has libicu installed"
              exit 1
            fi
            docker run --rm -v "$PWD/publish:/app:ro" "$image" /app/TuiCode --smoke-syntax
            timeout 30s script -qfec "docker run --rm -t -e TERM=xterm-256color -v $PWD/publish:/app:ro $image /app/TuiCode --smoke" /dev/null
            echo "::endgroup::"
          done

      - name: Syntax smoke
        # Headless (no TG), so it runs on every RID, Windows included.
        shell: bash
        run: ./publish/TuiCode --smoke-syntax

      - name: AOT smoke
        # `dotnet test` runs JIT, so AOT-only failures (missing metadata,
        # trim-stripped paths) only surface against the published native
        # binary. `script` allocates a pty so TG's driver initializes; the
        # harness is Unix-only, so this stays on linux-x64.
        if: matrix.rid == 'linux-x64'
        run: timeout 20s script -qfec './publish/TuiCode --smoke' /dev/null

  install-script:
    name: install.sh ${{ matrix.image }} ${{ matrix.arch }}
    # Against the latest published release, not this commit's build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:12', arch: x64, runner: ubuntu-24.04, setup: 'apt-get update -qq && apt-get install -qq -y --no-install-recommends curl ca-certificates >/dev/null' }
          - { image: 'debian:12', arch: arm64, runner: ubuntu-24.04-arm, setup: 'apt-get update -qq && apt-get install -qq -y --no-install-recommends curl ca-certificates >/dev/null' }
          - { image: 'ubuntu:22.04', arch: x64, runner: ubuntu-24.04, setup: 'apt-get update -qq && apt-get install -qq -y --no-install-recommends wget ca-certificates >/dev/null' }
          - { image: 'ubuntu:22.04', arch: arm64, runner: ubuntu-24.04-arm, setup: 'apt-get update -qq && apt-get install -qq -y --no-install-recommends wget ca-certificates >/dev/null' }
          - { image: 'fedora:latest', arch: x64, runner: ubuntu-24.04, setup: 'command -v tar >/dev/null || dnf install -q -y tar', offline: true }
          - { image: 'fedora:latest', arch: arm64, runner: ubuntu-24.04-arm, setup: 'command -v tar >/dev/null || dnf install -q -y tar', offline: true }
          # The official Arch image is x86_64 only.
          - { image: 'archlinux:latest', arch: x64, runner: ubuntu-24.04, setup: 'true', offline: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install, update and failure paths
        # `script` gives `docker run -t` the pty `tuicode --smoke` needs.
        env:
          SETUP: ${{ matrix.setup }}
        run: timeout 300s script -qfec "docker run --rm -t -e SETUP -e TERM=xterm-256color -v $PWD:/src:ro ${{ matrix.image }} sh /src/tests/install/test.sh /src/install.sh" /dev/null

      - name: No network
        # Only images that ship curl, since the container can't install one.
        if: matrix.offline
        run: |
          docker run --rm --network none -v "$PWD:/src:ro" ${{ matrix.image }} sh -c '
            out=$(sh /src/install.sh 2>&1) && exit 1
            echo "$out"
            [ ! -e ~/.local/bin/tuicode ] && echo "$out" | grep -q "Check your network"'
