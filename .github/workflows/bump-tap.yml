name: Bump Homebrew Tap

# Fires when a release transitions to published (either directly, or via
# `gh release edit … --draft=false`). The current release.yml creates draft
# releases for human sanity check; publishing the draft is what triggers this
# job, so the same human gate that says "assets look good" also gates the
# tap-formula bump. Prereleases (e.g. v0.x.y-rc1) are skipped.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAP_REPO: mentaldesk/homebrew-tap
    steps:
      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch SHA256s from release sidecars
        id: shas
        run: |
          v="${{ steps.v.outputs.version }}"
          tag="${{ steps.v.outputs.tag }}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          for rid in osx-arm64 linux-x64 linux-arm64; do
            sha=$(curl -fsSL "${base}/tuicode-${v}-${rid}.tar.gz.sha256" | awk '{print $1}')
            if [[ ! "$sha" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Bad SHA for $rid: $sha"
              exit 1
            fi
            # Output key uses underscores so it's a valid step-output identifier.
            echo "${rid//-/_}=${sha}" >> "$GITHUB_OUTPUT"
            echo "$rid -> $sha"
          done

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Rewrite formula
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA_OSX_ARM64: ${{ steps.shas.outputs.osx_arm64 }}
          SHA_LINUX_X64: ${{ steps.shas.outputs.linux_x64 }}
          SHA_LINUX_ARM64: ${{ steps.shas.outputs.linux_arm64 }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          path = "tap/Formula/tuicode.rb"
          version = os.environ["VERSION"]
          shas = {
              "osx-arm64":   os.environ["SHA_OSX_ARM64"],
              "linux-x64":   os.environ["SHA_LINUX_X64"],
              "linux-arm64": os.environ["SHA_LINUX_ARM64"],
          }

          with open(path) as f:
              text = f.read()

          new = re.sub(r'^(  version) "[^"]+"$', f'\\1 "{version}"', text, count=1, flags=re.M)
          if new == text:
              sys.exit("could not find version line")
          text = new

          # Match each platform's sha256 by the rid embedded in the preceding url line.
          for rid, sha in shas.items():
              pat = re.compile(
                  rf'(url "[^"]*-{re.escape(rid)}\.tar\.gz")\n(\s+)sha256 "[a-f0-9]+"'
              )
              new = pat.sub(rf'\1\n\g<2>sha256 "{sha}"', text, count=1)
              if new == text:
                  sys.exit(f"could not find sha256 block for {rid}")
              text = new

          with open(path, "w") as f:
              f.write(text)
          PY
          echo "--- diff ---"
          git -C tap diff --no-color Formula/tuicode.rb || true

      - name: Open / update PR against tap
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if git diff --quiet Formula/tuicode.rb; then
            echo "Formula already at ${VERSION} — nothing to do."
            exit 0
          fi

          branch="bump-tuicode-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Formula/tuicode.rb
          git commit -m "tuicode ${VERSION}

          Auto-bump from ${RELEASE_URL}"
          # --force-with-lease so a re-run after a notarization re-roll updates
          # the same branch instead of failing on stale history.
          git push --force-with-lease -u origin "$branch"

          body=$(cat <<EOF
          Bumps \`tuicode\` to ${VERSION}.

          Release: ${RELEASE_URL}

          Auto-generated by [TuiCode's bump-tap workflow](https://github.com/${{ github.repository }}/blob/main/.github/workflows/bump-tap.yml).
          EOF
          )

          if gh pr view "$branch" --repo "${{ env.TAP_REPO }}" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "${{ env.TAP_REPO }}" --title "tuicode ${VERSION}" --body "$body"
          else
            gh pr create --repo "${{ env.TAP_REPO }}" \
              --base main --head "$branch" \
              --title "tuicode ${VERSION}" \
              --body "$body"
          fi
